name: Inspect FTP folders

# Read-only: lists folders on the FTP account to find the web root. Uploads and deletes nothing.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP folders
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ls_dir() { curl -sS --list-only --max-time 30 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$1" 2>&1 | grep -vE '^\.\.?$' | sort; }
          walk() {
            local path="$1" depth="$2" indent="$3" entry
            ls_dir "$path" | while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              echo "${indent}${entry}"
              case "$entry" in assets|icons|api|node_modules|vendor|wp-content|wp-includes|wp-admin|.*) continue;; esac
              if [ "$depth" -gt 1 ] && curl -s --list-only --max-time 15 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/${path}${entry}/" >/dev/null 2>&1; then
                walk "${path}${entry}/" $((depth-1)) "${indent}    "
              fi
            done
          }
          echo "== FTP root as seen by this account =="
          walk "" 4 ""
